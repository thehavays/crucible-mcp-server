name: ✨ Feature Request
description: Propose a new feature, improvement, or capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "### Suggest a feature or improvement for Crucible MCP Server"
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Context
      description: What challenge or user need is this addressing?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution & Scope
      description: How should this feature work?
    validations:
      required: true
